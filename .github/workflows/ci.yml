name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job installs from uv.lock (`uv sync --locked`), so CI tests exactly the
# dependency versions a local `uv sync` gives. A plain `pip install` resolved
# the newest releases instead, and once tested a Rich the lockfile had never
# seen. `--locked` also fails the job if uv.lock is out of date with
# pyproject.toml, instead of re-resolving quietly; run `uv lock` and commit.
# (release.yml deliberately smoke-tests the built wheel with plain pip, which
# is what users get.)

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -v --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run --no-sync ruff check src/

      - name: Run mypy
        run: uv run --no-sync mypy src/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests with coverage
        run: |
          uv run --no-sync python -m pytest tests/ --cov=src/wijjit --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
