name: Docs

# Build the Sphinx documentation as a check. Publishing is Read the Docs' job
# (see .readthedocs.yaml); this workflow no longer deploys anywhere.
#
# It is kept rather than deleted because it is the only place the docs are
# built with `-W` before a merge: ci.yml has no docs job, and Read the Docs
# builds main and tags *after* the merge, so without this a broken
# cross-reference would land and only fail once it was too late to catch in
# review. Running it on pull requests is the whole point.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/wijjit/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/wijjit/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Sphinx site
        # -W turns warnings into errors, matching `fail_on_warning: true` in
        # .readthedocs.yaml so a build that passes here passes there too.
        run: |
          uv sync --extra dev
          uv run sphinx-build -b html -W docs/source docs/build/html
