name: Docs

# Build the Sphinx documentation as a check. Publishing is Read the Docs' job
# (see .readthedocs.yaml); this workflow no longer deploys anywhere.
#
# It is kept rather than deleted because it is the only place the docs are
# built with `-W` before a merge: ci.yml has no docs job, and Read the Docs
# builds main and tags *after* the merge, so without this a broken
# cross-reference would land and only fail once it was too late to catch in
# review. Running it on pull requests is the whole point.
#
# It builds from uv.lock with Python 3.13, the environment Read the Docs
# uses, so a build that passes here passes there. It also runs when only
# dependencies change (pyproject.toml, uv.lock): a newer Sphinx is exactly
# what broke the 0.1.2 docs on Read the Docs while this check stayed green.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/wijjit/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "docs/**"
      - "src/wijjit/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Read the Docs builds with 3.13 (.readthedocs.yaml), and the locked
          # Sphinx differs by interpreter (9.0.x on 3.11, 9.1 on 3.12+), so
          # build with the same one to see exactly what it will see.
          python-version: "3.13"

      - name: Build Sphinx site
        # -W turns warnings into errors, matching `fail_on_warning: true` in
        # .readthedocs.yaml so a build that passes here passes there too.
        run: |
          uv sync --locked --extra dev
          uv run sphinx-build -b html -W docs/source docs/build/html
