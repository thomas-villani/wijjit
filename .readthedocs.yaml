# Read the Docs build configuration.
#
# Read the Docs requires this file to be present on every branch or tag it
# builds; a version without it fails rather than falling back to a default.
# That includes historical tags -- see the note at the bottom.
#
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    # The newest interpreter the project supports (requires-python = ">=3.11").
    # .github/workflows/docs.yml builds with the same one.
    python: "3.13"
  jobs:
    # Install from uv.lock, exactly as CI does, instead of letting pip resolve
    # the newest releases. 0.1.2's docs failed here with a Sphinx (9.1) that
    # the lockfile, and so every pre-merge check, had never seen. `--locked`
    # fails the build if uv.lock is out of date with pyproject.toml.
    #
    # Installing the package itself (uv sync does) is required, not just
    # convenient: docs/source/conf.py reads the version via importlib.metadata,
    # and the autosummary API pages import wijjit to introspect it. The docs
    # dependencies live in the `dev` extra alongside the test and lint tooling.
    #
    # This is the recipe Read the Docs documents for uv:
    # https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --extra dev

sphinx:
  configuration: docs/source/conf.py
  # Match the `-W` used by .github/workflows/docs.yml. The build is
  # warning-clean, and a warning here usually means a broken cross-reference
  # that would otherwise ship silently.
  fail_on_warning: true

# Note on historical versions: the v0.1.0 tag predates this file, so activating
# it in the Read the Docs dashboard will fail to build. v0.1.1 and v0.1.2
# predate the uv install above and resolve their docs dependencies with pip, so
# they get whatever Sphinx is newest when built (v0.1.2 needs this branch's
# type-hint fix to build under Sphinx 9.1). Otherwise the oldest buildable
# version is 0.1.1.
